<!--
  匿名评论 & 点赞系统 — Twikoo
  部署 Twikoo Worker 后，将下方 TWIKOO_ENV_ID 替换为你的 Worker URL
  例如：https://twikoo.your-subdomain.workers.dev
  详见 https://twikoo.js.org/
-->
{{- $twikooEnvId := "https://twikoo.REPLACE_ME.workers.dev" -}}

<div class="post-interactions">
  <!-- 点赞按钮 -->
  <div class="like-section">
    <button id="like-btn" class="like-button" onclick="toggleLike()" title="点赞">
      <svg class="like-icon" viewBox="0 0 24 24" width="20" height="20">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span id="like-count">0</span>
    </button>
  </div>

  <!-- 分享按钮 -->
  <div class="share-section">
    <button class="share-button" onclick="sharePost()" title="分享">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</div>

<!-- Twikoo 评论区 -->
<div id="twikoo-comments"></div>

<script>
// ========== 点赞系统（localStorage 去重） ==========
(function() {
  const slug = window.location.pathname.replace(/^\/|\/$/g, '').replace(/\//g, '-') || 'home';
  const storageKey = 'liked-' + slug;
  const countKey = 'like-count-' + slug;

  function getCount() {
    return parseInt(localStorage.getItem(countKey) || '0', 10);
  }
  function setCount(n) {
    localStorage.setItem(countKey, n);
    const el = document.getElementById('like-count');
    if (el) el.textContent = n;
  }
  function hasLiked() {
    return localStorage.getItem(storageKey) === '1';
  }
  function setLiked(v) {
    if (v) localStorage.setItem(storageKey, '1');
    else localStorage.removeItem(storageKey);
    updateBtnState();
  }

  function updateBtnState() {
    const btn = document.getElementById('like-btn');
    if (!btn) return;
    if (hasLiked()) {
      btn.classList.add('liked');
    } else {
      btn.classList.remove('liked');
    }
  }

  window.toggleLike = function() {
    if (hasLiked()) {
      setCount(Math.max(0, getCount() - 1));
      setLiked(false);
    } else {
      setCount(getCount() + 1);
      setLiked(true);
    }
  };

  // 初始化
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('like-count').textContent = getCount();
    updateBtnState();
  });
})();

// ========== 分享系统 ==========
window.sharePost = function() {
  const url = window.location.href;
  const title = document.title;

  // 优先使用 Web Share API（移动端体验最好）
  if (navigator.share) {
    navigator.share({ title: title, url: url }).catch(() => {});
  } else {
    // 桌面端：复制链接
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function() {
        showToast('链接已复制 ✅');
      }).catch(function() {
        showToast('复制失败，请手动复制链接');
      });
    } else {
      // fallback
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('链接已复制 ✅');
    }
  }
};

function showToast(msg) {
  var toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;z-index:9999;font-size:14px;animation:fadeInOut 2s ease forwards;';
  document.body.appendChild(toast);
  setTimeout(function() { document.body.removeChild(toast); }, 2200);
}

// ========== Twikoo 评论 ==========
(function() {
  var twikooEnvId = {{ $twikooEnvId | safeJS }};
  // 如果 envId 含 REPLACE_ME，跳过加载（Twikoo 尚未部署）
  if (twikooEnvId.indexOf('REPLACE_ME') !== -1) {
    document.addEventListener('DOMContentLoaded', function() {
      var el = document.getElementById('twikoo-comments');
      if (el) {
        el.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">评论功能即将上线 — 等待 Twikoo 部署 🚀</p>';
      }
    });
    return;
  }

  // 动态加载 Twikoo SDK
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.all.min.js';
  script.onload = function() {
    twikoo.init({
      envId: twikooEnvId,
      el: '#twikoo-comments',
      lang: 'zh-cn',
      path: window.location.pathname,
      // 允许匿名评论（不要求登录）
      // Twikoo 默认支持匿名，无需额外配置
    });
  };
  document.head.appendChild(script);
})();
</script>

<style>
/* 点赞 & 分享样式 */
.post-interactions {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 32px 0 16px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.like-button,
.share-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--theme);
  color: var(--primary);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
}

.like-button:hover,
.share-button:hover {
  background: var(--border);
  transform: scale(1.05);
}

.like-button.liked .like-icon path {
  fill: #e74c3c;
  stroke: #e74c3c;
}

.like-button.liked {
  border-color: #e74c3c;
  color: #e74c3c;
}

@keyframes fadeInOut {
  0% { opacity: 0; transform: translate(-50%, 10px); }
  15% { opacity: 1; transform: translate(-50%, 0); }
  85% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -10px); }
}

/* Twikoo 评论区微调 */
#twikoo-comments {
  margin-top: 24px;
}

/* 暗色模式适配 */
:root {
  --liked-color: #e74c3c;
}
</style>
