# ╔═══════════════════════════════════════════════════════╗
# ║  可改文案汇总 — 搜 🔧 即可定位所有可自定义的文字     ║
# ╚═══════════════════════════════════════════════════════╝

baseURL: https://myblog.whatisissue.dpdns.org/  # 不用改
locale: zh-cn
# 🔧 站点标题：浏览器标签页、左上角 Logo 显示的文字
title: Issue 的博客
theme: PaperMod

# 构建配置
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 代码高亮
markup:
  highlight:
    style: monokai
    noClasses: false

# 🔧 导航菜单 — name 是显示文字，url 是链接目标
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

# 输出
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
# 🔧 站点元信息：SEO 描述、关键词、作者署名
  title: Issue的博客
  description: 记录Issue的一些奇思妙想
  keywords: [博客, 个人, 奇思妙想]
  author: Issue
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  # 文章显示
  ShowShareButtons: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true

  # 评论 (Twikoo — 见 layouts/partials/comments.html)
  comments: true

# 🔧 首页欢迎区 — 打开博客首页第一眼看到的文字
  homeInfoParams:
    Title: 这里是Issue的奇思妙想 👋
    Content: 谈一谈最近发生了什么，分享想分享的东西，最主要是Issue的胡言乱语。

  # 社交图标
  socialIcons:
    - name: github
      url: https://github.com/issue1651642438-cloud/myblog

  # 文章封面
  cover:
    responsiveImages: true

  # 搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
